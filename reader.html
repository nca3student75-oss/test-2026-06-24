<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100c"><title>제작일지</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><div class="topline"><a class="back" href="./">← 전체 제작일지</a><a class="back" href="guestbook.html">📻 방공호 통신망</a></div><article class="article" id="content"><p>기록을 불러오는 중입니다…</p></article><div class="foot">☢ 레디 포 아포칼립스: 공동 방공호</div></main><script>
const docs={offline:'content/offline.md',web1:'content/web1.md',web2:'content/web2.md',web3:'content/web3.md',web4:'content/web4.md',web5:'content/web5.md',ai:'content/ai.md'};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function render(md){const lines=md.replace(/\r/g,'').split('\n');let out='',ul=false,ol=false,quote=false,para=[];const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}if(quote){out+='</blockquote>';quote=false}};for(let i=0;i<lines.length;i++){let l=lines[i];if(/^```/.test(l)){flush();let code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';continue}if(/^#{1,4} /.test(l)){flush();let m=l.match(/^(#{1,4})\s+(.*)$/);let n=m[1].length;out+=`<h${n}>${inline(m[2])}</h${n}>`;continue}if(/^> /.test(l)){if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}if(!quote){out+='<blockquote>';quote=true}out+=inline(l.slice(2))+'<br>';continue}else if(quote){out+='</blockquote>';quote=false}if(/^[-*] /.test(l)){if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(ol){out+='</ol>';ol=false}if(!ul){out+='<ul>';ul=true}out+='<li>'+inline(l.replace(/^[-*] /,''))+'</li>';continue}else if(ul){out+='</ul>';ul=false}if(/^\d+\. /.test(l)){if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(!ol){out+='<ol>';ol=true}out+='<li>'+inline(l.replace(/^\d+\. /,''))+'</li>';continue}else if(ol){out+='</ol>';ol=false}if(/^---+$/.test(l.trim())){flush();out+='<hr>';continue}if(!l.trim()){if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}continue}para.push(l.trim())}flush();return out}
const key=new URLSearchParams(location.search).get('doc')||'offline';const file=docs[key];if(!file){document.getElementById('content').innerHTML='<h1>기록을 찾을 수 없습니다.</h1>'}else fetch(file,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.text()}).then(t=>{document.getElementById('content').innerHTML=render(t);const h=document.querySelector('#content h1');if(h)document.title=h.textContent+' — 제작일지'}).catch(()=>document.getElementById('content').innerHTML='<h1>기록을 불러오지 못했습니다.</h1><p>GitHub Pages 배포가 진행 중일 수 있습니다. 잠시 후 다시 열어주세요.</p>');
</script></body></html>
